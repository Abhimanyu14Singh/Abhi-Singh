[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyframe"
version = "1.24.0"
description = "SkyFrame - building analysis studio powered by OpenSees"
requires-python = ">=3.10"
dependencies = [
    "openseespy>=3.7",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0", "rhino3dm>=8.0,<9"]
# Rhino .3dm import / link (skyframe.io.rhino3dm_io); optional at runtime
rhino = ["rhino3dm>=8.0,<9"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
skyframe = "skyframe.desktop:main"

[tool.setuptools.packages.find]
include = ["skyframe*"]

[tool.setuptools.package-data]
"skyframe.api" = ["web/*", "web/js/*"]
"skyframe" = ["data/*/*.json"]
