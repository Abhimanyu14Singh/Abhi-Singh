[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyframe"
version = "1.7.0"
description = "SkyFrame - building analysis studio powered by OpenSees"
requires-python = ">=3.10"
dependencies = [
    "openseespy>=3.7",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
skyframe = "skyframe.desktop:main"

[tool.setuptools.packages.find]
include = ["skyframe*"]

[tool.setuptools.package-data]
"skyframe.api" = ["web/*", "web/js/*"]
