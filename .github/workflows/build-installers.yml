name: Build installers

# Produces ready-to-run SkyFrame desktop apps for Windows and Linux.
#
# HOW TO GET AN INSTALLER
#   * Quick (one build):  Actions tab -> "Build installers" -> Run workflow.
#     When it finishes, download the artifact for your OS from that run's
#     "Artifacts" section (needs a GitHub login).
#   * Shareable release:  push a version tag, e.g.
#         git tag v1.11.0 && git push origin v1.11.0
#     The installers are then attached to a GitHub *Release* — anyone can
#     download them from the repo's Releases page with no login.
#
# The full 630-test validation suite is the LOCAL release gate
# (packaging/build.sh runs it). This workflow deliberately skips it to keep
# Actions minutes low and guarantee installers are produced; it still boots
# and health-checks the frozen binary on every OS before publishing.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which installers to build"
        type: choice
        options: [all, windows, linux]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: write            # the release job needs this to publish assets

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    strategy:
      fail-fast: false        # a failing OS must not sink the others
      matrix:
        # manual runs can pick one OS (inputs.targets); tags build both
        include: ${{ fromJSON(
          (github.event_name == 'workflow_dispatch' && inputs.targets == 'windows')
            && '[{"os":"windows-latest","os_name":"windows","python":"3.12"}]'
          || (github.event_name == 'workflow_dispatch' && inputs.targets == 'linux')
            && '[{"os":"ubuntu-latest","os_name":"linux","python":"3.11"}]'
          || '[{"os":"windows-latest","os_name":"windows","python":"3.12"},{"os":"ubuntu-latest","os_name":"linux","python":"3.11"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skyframe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System deps (Linux only)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libblas3 liblapack3 \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install app + build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install ".[desktop,rhino,fast]" pyinstaller

      - name: Sanity-check the OpenSees import (unfrozen)
        run: python -c "import openseespy.opensees as ops; print('OpenSees import OK')"

      - name: Sanity-check the rhino3dm import (Rhino .3dm support)
        run: python -c "import rhino3dm; print('rhino3dm', rhino3dm.__version__)"

      - name: Sanity-check MKL PARDISO (unfrozen)
        run: python -c "from skyframe.engine import pardiso_solver as p; r = p.selftest(); print(r); assert r['ok']"

      - name: Freeze with PyInstaller
        run: >
          pyinstaller --noconfirm
          --distpath packaging/dist --workpath packaging/build
          packaging/skyframe.spec

      - name: Smoke-test the frozen binary (boots + /api/health)
        shell: bash
        timeout-minutes: 5
        run: |
          bin="packaging/dist/SkyFrame/SkyFrameCLI"
          [ "${{ matrix.os_name }}" = "windows" ] && bin="${bin}.exe"
          "$bin" --smoke
          "$bin" --selftest-pardiso

      # E1: parallel solves on the SPAWN worker pool inside the frozen app
      # (workers re-enter the executable via multiprocessing.freeze_support;
      # the run must match the serial run byte for byte).  Exit 0 = OK.
      - name: Parallel self-test of the frozen binary (spawn workers)
        shell: bash
        timeout-minutes: 10
        run: |
          bin="packaging/dist/SkyFrame/SkyFrameCLI"
          [ "${{ matrix.os_name }}" = "windows" ] && bin="${bin}.exe"
          "$bin" --selftest-parallel

      - name: Parallel self-test of the windowed SkyFrame.exe (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath "packaging/dist/SkyFrame/SkyFrame.exe" `
                 -ArgumentList "--selftest-parallel" -Wait -PassThru
          Write-Host "SkyFrame.exe --selftest-parallel exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      # The native window (pywebview -> pythonnet -> .NET) must start even
      # when Windows marks the files as downloaded from the internet (what a
      # GitHub ZIP does on the user's PC).  Copy the app, add that mark to
      # every binary, then open a real window + pop-out and check the sync.
      # Informational until hosted runners are confirmed to allow GUI windows.
      - name: Native window + pop-out self-test, files marked as downloaded (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "SkyFrame-motw"
          Copy-Item -Recurse -Force "packaging/dist/SkyFrame" $dst
          Get-ChildItem $dst -Recurse -Include *.dll,*.exe,*.pyd | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          & (Join-Path $dst "SkyFrameCLI.exe") --selftest-windows
          Write-Host "SkyFrameCLI.exe --selftest-windows exit code $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Engine service (docs/ENGINE_SERVICE.md): solve a Supa model from the
      # frozen exe, then run the local service, post a job from an allowed
      # page origin and poll it to the result (each job is a spawned process).
      - name: Engine service self-test of the frozen binary
        shell: bash
        timeout-minutes: 10
        run: |
          bin="packaging/dist/SkyFrame/SkyFrameCLI"
          [ "${{ matrix.os_name }}" = "windows" ] && bin="${bin}.exe"
          model="$RUNNER_TEMP/portal.model.json"
          cp skyframe/engine_service/schema/examples/portal.supa_model.json "$model"
          "$bin" --engine-solve "$model"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); m=r['pieces']['b']['D']['M']; print('beam M', m); sys.exit(0 if abs(m-50)<0.05 else 1)" "$RUNNER_TEMP/portal.out.json"
          "$bin" --engine-service --port 8766 --allow-origin https://supa.example.com &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8766/engine/version && break; sleep 1; done
          echo
          job=$(curl -sf -H "Origin: https://supa.example.com" -H "Content-Type: application/json" \
                --data-binary @"$model" http://127.0.0.1:8766/engine/supa/solve | python -c "import json,sys; print(json.load(sys.stdin)['job'])")
          for i in $(seq 1 60); do
            st=$(curl -sf "http://127.0.0.1:8766/engine/jobs/$job?wait=5" | python -c "import json,sys; print(json.load(sys.stdin)['state'])")
            echo "job $job: $st"; [ "$st" = "done" ] && break; [ "$st" = "failed" ] && exit 1
          done
          curl -sf "http://127.0.0.1:8766/engine/jobs/$job/result" | python -c "import json,sys; r=json.load(sys.stdin); print('engine', r['engine']['name'], r['engine']['api']); sys.exit(0 if abs(r['pieces']['b']['D']['M']-50)<0.05 else 1)"
          kill %1 || true

      - name: Upload the app folder as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyFrame-${{ matrix.os_name }}
          path: skyframe/packaging/dist/SkyFrame
          if-no-files-found: error

  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts        # -> artifacts/SkyFrame-<os>/SkyFrame/...

      - name: Package one archive per OS
        run: |
          set -eux
          cd artifacts
          for d in SkyFrame-*; do
            os="${d#SkyFrame-}"
            if [ "$os" = "windows" ]; then
              (cd "$d" && zip -qr "../SkyFrame-windows.zip" SkyFrame)
            else
              tar -C "$d" -czf "SkyFrame-${os}.tar.gz" SkyFrame
            fi
          done
          ls -la

      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SkyFrame-windows.zip
            artifacts/SkyFrame-*.tar.gz
          generate_release_notes: true
          body: |
            SkyFrame standalone desktop apps. Download the archive for your OS,
            unpack it anywhere, and run **SkyFrame** (`SkyFrame.exe` on Windows).
            No Python install required. If the desktop window doesn't open, run
            `SkyFrameCLI --server-only` and open http://127.0.0.1:8600 in a browser.
