name: Build SkyFrame desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/etabs-opensees-ui-rebuild-kt2zwh", "master"]
    paths: ["skyframe/**", ".github/workflows/build-desktop.yml"]

jobs:
  test:
    name: Validation suite (Linux)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: skyframe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps (BLAS/LAPACK for OpenSees)
        run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3
      - name: Install
        run: pip install -e .[dev]
      - name: Run 42-benchmark validation suite
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build ${{ matrix.os_name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            artifact: SkyFrame-windows
          - os: ubuntu-latest
            os_name: linux
            artifact: SkyFrame-linux
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: skyframe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: System deps (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3 \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install app + packaging tools
        run: pip install .[desktop,dev]

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/skyframe.spec

      - name: Smoke test the frozen app (headless)
        shell: bash
        run: ./packaging/dist/SkyFrame/SkyFrame --smoke

      - name: Package (zip)
        shell: bash
        run: |
          cd packaging/dist
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            7z a ../../${{ matrix.artifact }}.zip SkyFrame
          else
            tar czf ../../${{ matrix.artifact }}.tar.gz SkyFrame
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            skyframe/${{ matrix.artifact }}.zip
            skyframe/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyFrame-windows.zip
            SkyFrame-linux.tar.gz
          generate_release_notes: true
