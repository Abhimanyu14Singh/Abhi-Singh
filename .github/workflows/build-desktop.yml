name: Build SkyFrame desktop app

# Cost control (private-repo Actions minutes):
#   * every push runs ONLY the cheap Linux validation suite;
#   * the expensive Windows + Linux PyInstaller installer builds run only
#     on a version tag (v*) or a manual "Run workflow" dispatch.
# This keeps routine pushes to ~2 runner-minutes instead of ~12.

# Manual-only: the standalone app is built LOCALLY (see packaging/build.sh);
# this workflow no longer runs on push. Trigger it by hand from the Actions
# tab ("Run workflow") or by pushing a v* tag, only if you want cloud builds.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Validation suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: skyframe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps (BLAS/LAPACK for OpenSees)
        run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3
      - name: Install
        run: pip install -e .[dev]
      - name: Run validation suite
        run: python -m pytest tests/ -q --tb=short

  build:
    name: Build ${{ matrix.os_name }}
    needs: test
    # installers only on tags or manual dispatch — not on every push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            artifact: SkyFrame-windows
            # openseespywin's binary module is built against Python 3.12
            python: "3.12"
          - os: ubuntu-latest
            os_name: linux
            artifact: SkyFrame-linux
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults: { run: { working-directory: skyframe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: System deps (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3 \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install app + packaging tools
        run: pip install .[desktop,dev]

      - name: Sanity-check OpenSees import (unfrozen)
        run: python -c "import openseespy.opensees as ops; print('opensees import OK')"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/skyframe.spec

      - name: Smoke test the frozen app (headless)
        shell: bash
        timeout-minutes: 5
        run: timeout 180 ./packaging/dist/SkyFrame/SkyFrameCLI --smoke

      - name: Package (zip)
        shell: bash
        run: |
          cd packaging/dist
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            7z a ../../${{ matrix.artifact }}.zip SkyFrame
          else
            tar czf ../../${{ matrix.artifact }}.tar.gz SkyFrame
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            skyframe/${{ matrix.artifact }}.zip
            skyframe/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyFrame-windows.zip
            SkyFrame-linux.tar.gz
          generate_release_notes: true
